# SQL Server for local development only. In Azure, the API uses Azure SQL instead.
# Start it with `docker compose up -d` and stop it with `docker compose stop`.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ohq-sql
    environment:
      ACCEPT_EULA: "Y"
      # Local-only password. It must match the connection string in api/appsettings.Development.json.
      MSSQL_SA_PASSWORD: "LocalDev_Passw0rd"
    ports:
      # Only this machine can connect, not other devices on your network.
      - "127.0.0.1:1433:1433"
    volumes:
      # Keeps the data when the container is removed or recreated.
      - sql-data:/var/opt/mssql

volumes:
  sql-data:
